[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["phase_1/scripts"]
addopts = "--strict-markers --strict-config"
markers = [
  "unit: isolated behavior, edge cases, and errors",
  "integration: components working together",
  "e2e: supported process boundary and output contract",
  "gpu: requires CUDA and the real model",
  "network: downloads datasets or tokenizer assets",
]

[tool.mdformat]
wrap = "keep"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
omit = ["*/test_*.py", "*/conftest.py", "*/routing_test_helpers.py"]
patch = ["subprocess"]
