name: Ralph Loop Agent

on:
  issues:
    types: [labeled, reopened]

jobs:
  ralph-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only run when 'ready-for-agent' label is added/present
    if: contains(github.event.issue.labels.*.name, 'ready-for-agent')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Configure git
        run: |
          git config --global user.email "agent@example.com"
          git config --global user.name "Ralph Loop Agent"
          git config --global pull.rebase false

      - name: Run Ralph Loop Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd ${{ github.workspace }}
          python agents/ralph_loop_agent.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: agent-logs
          path: .logs/
          retention-days: 30

      - name: Comment on issue
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Ralph Loop Agent completed. Check the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details and the PR for the implementation.'
            })
